name: Deploy Digital Garden to Pages

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Generate Posts Index JSON
        shell: python
        run: |
          import os
          import json
          import re

          base_dir = 'digital-garden'
          categories = ['blog', 'research', 'notes', 'news']
          posts = []

          for cat in categories:
              cat_dir = os.path.join(base_dir, cat)
              if not os.path.exists(cat_dir):
                  continue
              # Walk recursively — research notes live in per-topic subdirectories
              # (e.g. research/qhda-quantum/README.md) and were previously never indexed.
              for root, _dirs, files in os.walk(cat_dir):
                for file in sorted(files):
                  if file.endswith('.md') and not file.startswith('_'):
                      filepath = os.path.join(root, file)
                      rel_path = os.path.relpath(filepath, base_dir).replace(os.sep, '/')
                      try:
                          with open(filepath, 'r', encoding='utf-8') as f:
                              content = f.read()
                          
                          title = file
                          date = ''
                          tags = []
                          
                          # Parsowanie Front Matter
                          fm_match = re.match(r'^---\s*\n(.*?)\n---\s*\n', content, re.DOTALL)
                          if fm_match:
                              fm_text = fm_match.group(1)
                              title_match = re.search(r'^title:\s*[\"\'\']?(.*?)[\"\'\']?$', fm_text, re.MULTILINE)
                              date_match = re.search(r'^date:\s*(.*?)$', fm_text, re.MULTILINE)
                              tags_match = re.search(r'^tags:\s*\[(.*?)\]$', fm_text, re.MULTILINE)
                              
                              if title_match:
                                  title = title_match.group(1).replace('\"', '').replace('\'', '')
                              if date_match:
                                  date = date_match.group(1).strip().replace('\"', '').replace('\'', '')
                              if tags_match:
                                  tags = [t.strip().strip('\"').strip('\'') for t in tags_match.group(1).split(',')]
                          
                          posts.append({
                              'title': title,
                              'date': date,
                              'tags': tags,
                              'category': cat,
                              'path': rel_path
                          })
                      except Exception as e:
                          print(f"Błąd podczas parsowania pliku {filepath}: {e}")

          with open(os.path.join(base_dir, 'posts.json'), 'w', encoding='utf-8') as f:
              json.dump(posts, f, ensure_ascii=False, indent=2)
          print('Successfully generated posts.json')

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './digital-garden'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4